<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle 5</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>PUZZLE</h1>

    <p>
        Pecahkan pesan yang tersembunyi di dalam angka berikut:
    </p>

    <h2>
        54 48 45 20 41 4E 53 57 45 52
        20 4C 49 45 53 20 42 45 48 49 4E 44
    </h2>

    <p>
        "Not everything you are looking for is ahead
        <br>
       sometimes, the answer is actually waiting  <a href="behind.html" style="color: inherit; text-decoration: none;">behind</a>.
     <br>
        kalian pernah di jelas kan tentang angka ini oleh guru kalian
    </p>

    <br>

    <input
        type="text"
        id="jawaban"
        placeholder="Masukkan jawaban">

    <br><br>

    <button onclick="cekJawaban()">LANJUT</button>

    <p id="hasil"></p>

</div>

<script>

function cekJawaban() {

    let jawaban = document.getElementById("jawaban").value.trim();

    if (jawaban === "13010") {

        window.location.href = "puzzlelast.html";

    } else {

        document.getElementById("hasil").innerHTML =
        "Jawaban masih salah.";

    }

}

</script>

</body>
</html>
