<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DISCOVER - V FOX</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #000;
            color: #39ff14;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 700px;

            text-align: center;
        }

        /* JUDUL */

        h1 {
            font-size: 52px;

            letter-spacing: 8px;

            margin: 0 0 30px;

            font-weight: normal;

            text-shadow:
                0 0 5px #39ff14,
                0 0 15px #39ff14;
        }

        /* KALIMAT */

        .quote {
            font-size: 18px;

            line-height: 1.7;

            margin-bottom: 55px;

            opacity: 0.85;
        }

        /* TOMBOL */

        .start-button {
            padding: 14px 40px;

            background: transparent;

            color: #39ff14;

            border: 1px solid #39ff14;

            font-size: 15px;

            letter-spacing: 3px;

            cursor: pointer;

            transition:
                background 0.3s,
                color 0.3s,
                box-shadow 0.3s;
        }

        .start-button:hover {
            background: #39ff14;

            color: #000;

            box-shadow:
                0 0 10px #39ff14,
                0 0 25px #39ff14;
        }

        /* GARIS KECIL */

        .line {
            width: 80px;
            height: 1px;

            background: #39ff14;

            margin: 0 auto 30px;

            opacity: 0.6;
        }

        /* HP */

        @media (max-width: 600px) {

            h1 {
                font-size: 38px;
                letter-spacing: 6px;
            }

            .quote {
                font-size: 16px;
            }

            .start-button {
                padding: 13px 32px;
            }

        }

    </style>
</head>


<body>

    <div class="container">

        <div class="line"></div>

        <h1>DISCOVER</h1>

        <div class="quote">
            "Tidak semua yang dicari<br>
            ingin ditemukan."
        </div>

        <button
            class="start-button"
            onclick="startDiscover()">

            MULAI

        </button>

    </div>


    <script>

        function startDiscover() {

            window.location.href =
                "discover-cerita.html";

        }

    </script>

</body>
</html>
