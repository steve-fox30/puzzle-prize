<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>THE END - V FOX</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #000;
            color: #39ff14;

            font-family: "Courier New", monospace;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        /* =========================
           CONFETTI
        ========================= */

        .confetti {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .confetti span {
            position: absolute;

            width: 5px;
            height: 14px;

            background: #39ff14;

            animation: fall linear infinite;
        }

        .confetti span:nth-child(1) {
            left: 5%;
            animation-duration: 4s;
            animation-delay: 0s;
        }

        .confetti span:nth-child(2) {
            left: 15%;
            animation-duration: 5s;
            animation-delay: 1s;
        }

        .confetti span:nth-child(3) {
            left: 25%;
            animation-duration: 3.5s;
            animation-delay: 0.5s;
        }

        .confetti span:nth-child(4) {
            left: 35%;
            animation-duration: 4.5s;
            animation-delay: 2s;
        }

        .confetti span:nth-child(5) {
            left: 45%;
            animation-duration: 3s;
            animation-delay: 1s;
        }

        .confetti span:nth-child(6) {
            left: 55%;
            animation-duration: 4s;
            animation-delay: 0.2s;
        }

        .confetti span:nth-child(7) {
            left: 65%;
            animation-duration: 5s;
            animation-delay: 1.5s;
        }

        .confetti span:nth-child(8) {
            left: 75%;
            animation-duration: 3.5s;
            animation-delay: 0.7s;
        }

        .confetti span:nth-child(9) {
            left: 85%;
            animation-duration: 4.5s;
            animation-delay: 2s;
        }

        .confetti span:nth-child(10) {
            left: 95%;
            animation-duration: 3s;
            animation-delay: 0.5s;
        }

        @keyframes fall {

            0% {
                top: -20px;
                transform: rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            100% {
                top: 110vh;
                transform: rotate(360deg);
                opacity: 0;
            }

        }

        /* =========================
           MAIN
        ========================= */

        .container {
            position: relative;
            z-index: 5;

            width: 90%;
            max-width: 700px;

            text-align: center;
        }

        .fox {
            font-size: 18px;
            letter-spacing: 6px;

            margin-bottom: 30px;

            animation: glow 1.5s infinite alternate;
        }

        h1 {
            font-size: 52px;
            letter-spacing: 12px;

            margin: 0 0 25px;

            animation: titleGlow 1.5s infinite alternate;
        }

        .message {
            font-size: 17px;
            line-height: 2;

            margin-bottom: 35px;
        }

        /* =========================
           CONGRATULATIONS
        ========================= */

        .congrats {
            display: inline-block;

            color: #39ff14;

            font-size: 25px;
            font-weight: bold;

            letter-spacing: 5px;

            text-decoration: none;

            padding: 15px 25px;

            border: 1px solid #39ff14;

            transition: 0.3s;

            animation: pulse 1.5s infinite;
        }

        .congrats:hover {
            background: #39ff14;
            color: #000;

            box-shadow:
                0 0 10px #39ff14,
                0 0 30px #39ff14;
        }

        .the-end {
            margin-top: 35px;

            font-size: 14px;

            letter-spacing: 5px;

            opacity: 0.7;
        }

        /* =========================
           ANIMATION
        ========================= */

        @keyframes glow {

            from {
                text-shadow: 0 0 3px #39ff14;
            }

            to {
                text-shadow:
                    0 0 8px #39ff14,
                    0 0 20px #39ff14;
            }

        }

        @keyframes titleGlow {

            from {
                text-shadow:
                    0 0 5px #39ff14;
            }

            to {
                text-shadow:
                    0 0 10px #39ff14,
                    0 0 35px #39ff14;
            }

        }

        @keyframes pulse {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.04);
            }

            100% {
                transform: scale(1);
            }

        }

        /* =========================
           HP
        ========================= */

        @media (max-width: 600px) {

            h1 {
                font-size: 35px;
                letter-spacing: 7px;
            }

            .message {
                font-size: 14px;
            }

            .congrats {
                font-size: 19px;
                letter-spacing: 3px;
            }

        }
    </style>
</head>

<body>

    <!-- CONFETTI -->

    <div class="confetti">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>


    <!-- ISI ENDING -->

    <div class="container">

        <div class="fox">
            V FOX
        </div>

        <h1>
            YOU FOUND IT.
        </h1>

        <div class="message">

            Kau berhasil sampai sejauh ini.<br>

            Semua teka-teki telah terlewati.<br>

            Sekarang waktunya melihat apa yang menunggu.

        </div>


        <!-- GANTI hadiah.html DENGAN NAMA HALAMAN TUJUAN LU -->

        <a
            href="end-clue.html"
            class="congrats"
        >
            CONGRATULATIONS
        </a>


        <div class="the-end">
            THE END
        </div>

    </div>

</body>
</html>
