<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SEARCH - V FOX</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            background: #000;
            color: #39ff14;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 650px;

            text-align: center;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 35px;
        }

        .keyword {
            font-size: 18px;
            margin-bottom: 35px;
        }

        .cipher {
            font-size: 22px;
            letter-spacing: 4px;
            line-height: 2;

            margin-bottom: 35px;
            word-wrap: break-word;
        }

        input {
            width: 80%;
            max-width: 350px;

            padding: 13px;

            background: #000;
            color: #39ff14;

            border: 1px solid #39ff14;

            text-align: center;
            font-size: 16px;

            outline: none;
        }

        input:focus {
            box-shadow: 0 0 8px #39ff14;
        }

        button {
            padding: 13px 28px;

            margin-top: 18px;

            background: #071f0b;
            color: #39ff14;

            border: 1px solid #39ff14;

            font-size: 15px;
            letter-spacing: 1px;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover:not(:disabled) {
            background: #39ff14;
            color: #000;
        }

        .message {
            min-height: 25px;
            margin-top: 20px;
        }

        /* BAGIAN LANJUT */

        #nextSection {
            margin-top: 45px;
        }

        .locked {
            opacity: 0.35;

            color: #245c24;
            border-color: #245c24;

            background: #020802;

            cursor: not-allowed;
        }

        .hidden {
            display: none;
        }

    </style>
</head>


<body>

    <div class="container">

        <h1>SEARCH</h1>


        <div class="keyword">
            Keyword: CIPHER
        </div>


        <!-- CIPHERTEXT -->

        <div class="cipher">

            ABAAB BAABB BAAAA<br>
            BAAAB ABAAA
            

        </div>


        <!-- INPUT -->

        <input
            type="text"
            id="answer"
            placeholder="Masukkan jawaban"
            autocomplete="off"
        >


        <br>


        <button onclick="checkAnswer()">
            CEK
        </button>


        <div
            id="message"
            class="message">
        </div>


        <!-- NEXT -->

        <div id="nextSection">

            <button
                id="nextButton"
                class="locked"
                disabled>

                BANGUN DATAR

            </button>

        </div>

    </div>


    <script>

        function checkAnswer() {

            const answer =
                document
                .getElementById("answer")
                .value
                .trim()
                .toUpperCase();

            const message =
                document
                .getElementById("message");

            const nextButton =
                document
                .getElementById("nextButton");


            if (answer === "KURSI") {

                message.innerText =
                    "Benar.";

                nextButton.disabled = false;

                nextButton.classList.remove("locked");

                localStorage.setItem(
                    "searchPuzzle1Solved",
                    "true"
                );

            }

            else {

                message.innerText =
                    "Jawaban belum tepat.";

            }

        }


        /* TOMBOL BANGUN DATAR */

        document
        .getElementById("nextButton")
        .addEventListener("click", function() {

            if (!this.disabled) {

                window.location.href =
                    "search-bangun.html";

            }

        });

    </script>

</body>
</html>
