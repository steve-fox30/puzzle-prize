<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>V FOX</title>

    <style>
        /* =========================
           BACKGROUND
        ========================= */

        body {
            background: #000;
            color: #39ff14;
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;
        }


        /* =========================
           CONTAINER
        ========================= */

        .final-puzzle {
            text-align: center;
            padding-top: 50px;
        }


        /* =========================
           TITLE
        ========================= */

        .final-puzzle h1 {
            margin-bottom: 40px;

            font-family: Georgia, serif;
            font-size: 32px;

            color: #39ff14;
        }


        /* =========================
           BUTTON CONTAINER
        ========================= */

        .puzzle-buttons {
            display: flex;
            flex-direction: column;

            gap: 15px;

            width: 350px;
            max-width: 85%;

            margin: auto;
        }


        /* =========================
           BUTTON
        ========================= */

        .puzzle-button {
            width: 100%;

            padding: 15px 10px;

            border: 1px solid #39ff14;

            background: #071f0b;

            color: #39ff14;

            font-size: 16px;
            letter-spacing: 3px;

            cursor: pointer;

            transition: 0.2s;
        }


        /* =========================
           BUTTON AKTIF
        ========================= */

        .puzzle-button:hover:not(:disabled) {
            background: #39ff14;
            color: #000;
        }


        /* =========================
           BUTTON TERKUNCI
        ========================= */

        .puzzle-button:disabled {
            background: #020802;

            color: #245c24;

            border-color: #245c24;

            cursor: not-allowed;

            opacity: 0.8;
        }


        /* =========================
           PUZZLE SELESAI
        ========================= */

        .completed {
            background: #0b3d12;

            color: #39ff14;

            opacity: 0.7;
        }

    </style>
</head>


<body>

    <div class="final-puzzle">

        <h1>V FOX</h1>


        <div class="puzzle-buttons">


            <!-- =====================
                 BEGIN
            ====================== -->

            <button
                id="beginButton"
                class="puzzle-button"
                onclick="goToPuzzle('begin')">

                BEGIN

            </button>


            <!-- =====================
                 SEARCH
            ====================== -->

            <button
                id="searchButton"
                class="puzzle-button"
                onclick="goToPuzzle('search')"
                disabled>

                ?????

            </button>


            <!-- =====================
                 DISCOVER
            ====================== -->

            <button
                id="discoverButton"
                class="puzzle-button"
                onclick="goToPuzzle('discover')"
                disabled>

                ?????

            </button>


            <!-- =====================
                 END
            ====================== -->

            <button
                id="endButton"
                class="puzzle-button"
                onclick="goToPuzzle('end')"
                disabled>

                ?????

            </button>


        </div>

    </div>



    <script>

        /* =================================
           CEK PROGRESS
        ================================= */

        const beginSolved =
            localStorage.getItem("beginSolved") === "true";

        const searchSolved =
            localStorage.getItem("searchSolved") === "true";

        const discoverSolved =
            localStorage.getItem("discoverSolved") === "true";

        const endSolved =
            localStorage.getItem("endSolved") === "true";


        /* =================================
           AMBIL BUTTON
        ================================= */

        const beginButton =
            document.getElementById("beginButton");

        const searchButton =
            document.getElementById("searchButton");

        const discoverButton =
            document.getElementById("discoverButton");

        const endButton =
            document.getElementById("endButton");


        /* =================================
           BEGIN
        ================================= */

        if (beginSolved) {

            beginButton.innerText = "✓ BEGIN";

            beginButton.classList.add("completed");

        }


        /* =================================
           SEARCH
        ================================= */

        if (beginSolved) {

            searchButton.disabled = false;

            searchButton.innerText = "SEARCH";

        }


        if (searchSolved) {

            searchButton.innerText = "✓ SEARCH";

            searchButton.classList.add("completed");

        }


        /* =================================
           DISCOVER
        ================================= */

        if (searchSolved) {

            discoverButton.disabled = false;

            discoverButton.innerText = "DISCOVER";

        }


        if (discoverSolved) {

            discoverButton.innerText = "✓ DISCOVER";

            discoverButton.classList.add("completed");

        }


        /* =================================
           END
        ================================= */

        if (discoverSolved) {

            endButton.disabled = false;

            endButton.innerText = "END";

        }


        if (endSolved) {

            endButton.innerText = "✓ END";

            endButton.classList.add("completed");

        }


        /* =================================
           PINDAH HALAMAN
        ================================= */

        function goToPuzzle(puzzle) {


            if (puzzle === "begin") {

                window.location.href = "begin.html";

            }


            else if (puzzle === "search") {

                if (beginSolved) {

                    window.location.href = "search.html";

                }

            }


            else if (puzzle === "discover") {

                if (searchSolved) {

                    window.location.href = "discover.html";

                }

            }


            else if (puzzle === "end") {

                if (discoverSolved) {

                    window.location.href = "end.html";

                }

            }

        }

    </script>

</body>
</html>
