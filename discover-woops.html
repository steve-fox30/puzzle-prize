<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WOOPS - V FOX</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            background: #000;
            color: #39ff14;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            text-align: center;
        }

        /* GAMBAR RUBAH */

        .fox-image {
            width: 100%;
            max-width: 500px;

            display: block;
            margin: 0 auto 30px;

            border: 1px solid #39ff14;
        }

        /* TULISAN EJEKAN */

        .message {
            font-size: 22px;
            line-height: 1.6;

            margin-bottom: 35px;
        }

        /* TOMBOL KEMBALI */

        button {
            padding: 13px 28px;

            background: #071f0b;
            color: #39ff14;

            border: 1px solid #39ff14;

            font-size: 15px;
            letter-spacing: 1px;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #39ff14;
            color: #000;
        }

    </style>
</head>


<body>

    <div class="container">

        <!-- GAMBAR RUBAH -->
        <img
            src="woops2.jpg"
            alt="Rubah"
            class="fox-image"
        >


        <!-- TULISAN EJEKAN -->
        <div class="message">
            WOOPS...<br>
            KAYAKNYA LU SALAH JALAN. 🦊
        </div>


        <!-- TOMBOL KEMBALI -->
        <button onclick="goBack()">
            KEMBALI
        </button>

    </div>


    <script>

        function goBack() {
            window.location.href = "puzzlelast.html";
        }

    </script>

</body>
</html>
